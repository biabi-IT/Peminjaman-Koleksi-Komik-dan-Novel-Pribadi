<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Comic.Read</title>
    <style>
        .brand-tag {
            background: #ffc107;
            color: #212529;
            padding: 0 .5rem;
            border-radius: .25rem;
            display: inline-block;
            transform: rotate(-3deg);
        }

        .auth-card {
            border: 2px solid #212529;
            box-shadow: 5px 5px 0 #212529;
        }

        .btn-warning {
            font-weight: 600;
        }

        .form-control:focus {
            border-color: #ffc107;
            box-shadow: 0 0 0 .25rem rgba(255, 193, 7, .35);
        }

        .form-check-input:checked {
            background-color: #ffc107;
            border-color: #ffc107;
        }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-body-tertiary">
    <main class="container d-flex align-items-center justify-content-center min-vh-100 py-4">
        <div class="card auth-card w-100" style="max-width: 400px;">
            <div class="card-body p-4">
                <h1 class="h4 text-center mb-1"><span class="brand-tag">Comic</span> Read</h1>
                <p class="text-center text-body-secondary small mb-4">Masuk untuk mengelola koleksimu</p>

                <form action="index.html" method="post">
                    <div class="mb-3">
                        <label class="form-label" for="email">Email</label>
                        <input type="email" class="form-control" id="email" name="email"
                            placeholder="masukkan email anda" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="password">Password</label>
                        <input type="password" class="form-control" id="password" name="password"
                            placeholder="masukkan password anda" required>
                    </div>
                    <button class="btn btn-warning w-100">Masuk</button>
                </form>

                <p class="text-center text-body-secondary small mt-3 mb-0">
                    Belum punya akun? <a href="daftar.html">Daftar di sini</a>
                </p>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
