<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Comic.Read</title>
    <style>
        .brand-tag {
            background: #ffc107;
            color: #212529;
            padding: 0 .5rem;
            border-radius: .25rem;
            display: inline-block;
            transform: rotate(-3deg);
        }

        .list-group-item-action.active {
            background-color: #ffc107;
            border-color: #ffc107;
            color: #212529;
            font-weight: 600;
        }

        .stat-num {
            font-size: 2.2rem;
            font-weight: 700;
            line-height: 1.1;
        }

        td.aksi {
            white-space: nowrap;
            text-align: end;
        }

        .login-card {
            max-width: 380px;
        }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-body-tertiary">
    <main class="container d-flex align-items-center justify-content-center min-vh-100">
        <div class="card shadow-sm w-100 login-card">
            <div class="card-body p-4">
                <h1 class="h4 text-center mb-4"><span class="brand-tag">Comic</span> Read</h1>
                <form action="index.html">
                    <div class="mb-3"><label class="form-label">Username</label><input class="form-control"
                            name="username" required></div>
                    <div class="mb-3"><label class="form-label">Password</label><input type="password"
                            class="form-control" name="password" required></div>
                    <button class="btn btn-warning w-100">Masuk</button>
                </form>
            </div>
        </div>
    </main>
</body>

</html>
