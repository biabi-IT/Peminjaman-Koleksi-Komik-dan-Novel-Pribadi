<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Genre - Comic.Read</title>
    <style>
        .brand-tag {
            background: #ffc107;
            color: #212529;
            padding: 0 .5rem;
            border-radius: .25rem;
            display: inline-block;
            transform: rotate(-3deg);
        }

        .list-group-item-action.active {
            background-color: #ffc107;
            border-color: #ffc107;
            color: #212529;
            font-weight: 600;
        }

        .stat-num {
            font-size: 2.2rem;
            font-weight: 700;
            line-height: 1.1;
        }

        td.aksi {
            white-space: nowrap;
            text-align: end;
        }

        .login-card {
            max-width: 380px;
        }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar bg-body-tertiary border-bottom mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="index.html"><span class="brand-tag">Comic</span>Read</a>
            <a class="btn btn-outline-secondary btn-sm" href="login.html">Logout</a>
        </div>
    </nav>
    <div class="container-xl">
        <div class="row g-4">
            <div class="col-md-3 col-lg-2">
                <div class="list-group"><a class="list-group-item list-group-item-action"
                        href="index.html">Dashboard</a><a class="list-group-item list-group-item-action active"
                        href="genre.html">Genre</a><a class="list-group-item list-group-item-action"
                        href="koleksi.html">Koleksi</a><a class="list-group-item list-group-item-action"
                        href="teman.html">Teman</a><a class="list-group-item list-group-item-action"
                        href="peminjaman.html">Peminjaman</a><a class="list-group-item list-group-item-action"
                        href="laporan.html">Laporan</a></div>
            </div>
            <div class="col-md-9 col-lg-10">
                <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                    <h1 class="h4 m-0">Genre</h1>
                    <button class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#frm">+ Tambah genre</button>
                </div>
                <div class="row g-2 mb-3">
                    <div class="col"><input type="search" class="form-control" placeholder="Cari genre..."
                            data-table="#tbl"></div>
                </div>
                <div class="card">
                    <div class="table-responsive">
                        <table class="table table-hover table-striped align-middle mb-0" id="tbl">
                            <thead>
                                <tr>
                                    <th>Nama genre</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Shonen</td>
                                    <td class="aksi"><button class="btn btn-sm btn-outline-secondary"
                                            data-bs-toggle="modal" data-bs-target="#frm">Ubah</button> <button
                                            class="btn btn-sm btn-outline-danger" data-bs-toggle="modal"
                                            data-bs-target="#hapus">Hapus</button></td>
                                </tr>
                                <tr>
                                    <td>Fantasi</td>
                                    <td class="aksi"><button class="btn btn-sm btn-outline-secondary"
                                            data-bs-toggle="modal" data-bs-target="#frm">Ubah</button> <button
                                            class="btn btn-sm btn-outline-danger" data-bs-toggle="modal"
                                            data-bs-target="#hapus">Hapus</button></td>
                                </tr>
                                <tr>
                                    <td>Misteri</td>
                                    <td class="aksi"><button class="btn btn-sm btn-outline-secondary"
                                            data-bs-toggle="modal" data-bs-target="#frm">Ubah</button> <button
                                            class="btn btn-sm btn-outline-danger" data-bs-toggle="modal"
                                            data-bs-target="#hapus">Hapus</button></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="frm" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <form class="modal-content" onsubmit="return false">
                <div class="modal-header">
                    <h2 class="modal-title fs-5">Form genre</h2><button type="button" class="btn-close"
                        data-bs-dismiss="modal" aria-label="Tutup"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3"><label class="form-label">Nama genre</label><input class="form-control"
                            type="text" name="nama" required></div>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-outline-secondary"
                        data-bs-dismiss="modal">Batal</button><button class="btn btn-warning">Simpan</button></div>
            </form>
        </div>
    </div>
    <div class="modal fade" id="hapus" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-sm modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body">Hapus data ini? Tindakan ini tidak bisa dibatalkan.</div>
                <div class="modal-footer"><button class="btn btn-outline-secondary"
                        data-bs-dismiss="modal">Batal</button><button class="btn btn-danger"
                        data-bs-dismiss="modal">Hapus</button></div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
