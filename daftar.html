<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daftar - Comic.Read</title>
    <style>
        .brand-tag {
            background: #ffc107;
            color: #212529;
            padding: 0 .5rem;
            border-radius: .25rem;
            display: inline-block;
            transform: rotate(-3deg);
        }

        .auth-card {
            border: 2px solid #212529;
            box-shadow: 5px 5px 0 #212529;
        }

        .btn-warning {
            font-weight: 600;
        }

        .form-control:focus {
            border-color: #ffc107;
            box-shadow: 0 0 0 .25rem rgba(255, 193, 7, .35);
        }

        .form-check-input:checked {
            background-color: #ffc107;
            border-color: #ffc107;
        }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-body-tertiary">
    <main class="container d-flex align-items-center justify-content-center min-vh-100 py-4">
        <div class="card auth-card w-100" style="max-width: 460px;">
            <div class="card-body p-4">
                <h1 class="h4 text-center mb-1"><span class="brand-tag">Comic</span> Read</h1>
                <p class="text-center text-body-secondary small mb-4">Buat akun baru</p>

                <form action="login.html" method="post">
                    <div class="mb-3">
                        <label class="form-label" for="nama">Nama lengkap</label>
                        <input class="form-control" id="nama" name="nama"
                            placeholder="masukkan nama lengkap anda" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="email">Email</label>
                        <input type="email" class="form-control" id="email" name="email"
                            placeholder="masukkan email anda" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="password">Password</label>
                        <input type="password" class="form-control" id="password" name="password" minlength="6"
                            placeholder="minimal 6 karakter" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="alamat">Alamat</label>
                        <input class="form-control" id="alamat" name="alamat"
                            placeholder="masukkan alamat lengkap anda" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="hp">No HP</label>
                        <input type="tel" class="form-control" id="hp" name="hp" pattern="[0-9+ ]{8,16}"
                            placeholder="masukkan No HP anda" required>
                    </div>
                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="setuju" required>
                        <label class="form-check-label" for="setuju">Saya setuju dengan syarat dan ketentuan</label>
                    </div>
                    <button class="btn btn-warning w-100">Daftar</button>
                </form>

                <p class="text-center text-body-secondary small mt-3 mb-0">
                    Sudah punya akun? <a href="login.html">Masuk</a>
                </p>
            </div>
        </div>
    </main>
</body>

</html>
