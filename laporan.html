<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Laporan - Comic.Read</title>
    <style>
        .brand-tag {
            background: #ffc107;
            color: #212529;
            padding: 0 .5rem;
            border-radius: .25rem;
            display: inline-block;
            transform: rotate(-3deg);
        }

        .list-group-item-action.active {
            background-color: #ffc107;
            border-color: #ffc107;
            color: #212529;
            font-weight: 600;
        }

        .stat-num {
            font-size: 2.2rem;
            font-weight: 700;
            line-height: 1.1;
        }

        td.aksi {
            white-space: nowrap;
            text-align: end;
        }

        .login-card {
            max-width: 380px;
        }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar bg-body-tertiary border-bottom mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="index.html"><span class="brand-tag">Comic</span> Read</a>
            <a class="btn btn-outline-secondary btn-sm" href="login.html">Logout</a>
        </div>
    </nav>
    <div class="container-xl">
        <div class="row g-4">
            <div class="col-md-3 col-lg-2">
                <div class="list-group"><a class="list-group-item list-group-item-action"
                        href="index.html">Dashboard</a><a class="list-group-item list-group-item-action"
                        href="genre.html">Genre</a><a class="list-group-item list-group-item-action"
                        href="koleksi.html">Koleksi</a><a class="list-group-item list-group-item-action"
                        href="teman.html">Teman</a><a class="list-group-item list-group-item-action"
                        href="peminjaman.html">Peminjaman</a><a class="list-group-item list-group-item-action active"
                        href="laporan.html">Laporan</a></div>
            </div>
            <div class="col-md-9 col-lg-10">
                <h1 class="h4 mb-3">Laporan</h1>
                <form class="row g-2 mb-3" onsubmit="return false">
                    <div class="col-6 col-md-4 col-lg"><select class="form-select" aria-label="Semua genre">
                            <option value="">Semua genre</option>
                            <option>Shonen</option>
                            <option>Fantasi</option>
                            <option>Misteri</option>
                        </select></div>
                    <div class="col-6 col-md-4 col-lg"><select class="form-select" aria-label="Semua status">
                            <option value="">Semua status</option>
                            <option>Tersedia</option>
                            <option>Dipinjam</option>
                        </select></div>
                    <div class="col-6 col-md-4 col-lg"><select class="form-select" aria-label="Semua teman">
                            <option value="">Semua teman</option>
                        </select></div>
                    <div class="col-6 col-md-6 col-lg"><input type="date" class="form-control"
                            aria-label="Dari tanggal"></div>
                    <div class="col-6 col-md-6 col-lg"><input type="date" class="form-control"
                            aria-label="Sampai tanggal"></div>
                    <div class="col-12 col-lg-auto"><button class="btn btn-warning w-100">Tampilkan</button></div>
                </form>
                        <table class="table mb-0">
                            <thead>
                                <tr>
                                    <th>Judul</th>
                                    <th>Genre</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
